<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#000;color:#fff;overflow:hidden}
.layar{position:absolute;top:0;left:0;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:1.2s ease;background:center/cover no-repeat;}
.layar::before{ content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);}
.layar.active{opacity:1;pointer-events:all}
.s1{background-image:url('https://i.imgur.com/AYceRsN.jpg')}
.s2{background-image:url('https://i.imgur.com/TaTxA2w.jpg')}
.s3{background-image:url('https://i.imgur.com/77DtrP1.jpg')}
.s4{background-image:url('https://i.imgur.com/Y0Gai2v.jpg')}
.s5{background-image:url('https://i.imgur.com/AYceRsN.jpg')}
.float-text{position:relative;z-index:2;font-size:3.5em;font-weight:600;background:linear-gradient(90deg,#fff,#ffd6f6,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 3s ease-in-out infinite;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px #ff99cc)}50%{filter:drop-shadow(0 0 25px #ff66aa)}}
.btn{position:relative;z-index:2;margin-top:20px;padding:12px 25px;background:#ff66aa;border:none;border-radius:25px;color:#fff;font-size:1.1em;cursor:pointer;transition:0.3s;}
.btn:hover{background:#ff3399;transform:scale(1.1)}
</style>
</head>
<body>
<div class="layar s1 active"><div class="float-text">Hi Sahabatku</div><button class="btn" onclick="next(2)">Next</button></div>
<div class="layar s2"><div class="float-text">Makasih udah selalu ada</div><button class="btn" onclick="next(3)">Next</button></div>
<div class="layar s3"><div class="float-text">Kamu orang terbaik</div><button class="btn" onclick="next(4)">Next</button></div>
<div class="layar s4"><div class="float-text">Aku sayang kamu</div><button class="btn" onclick="next(5)">Next</button></div>
<div class="layar s5"><div class="float-text">Selamanya 🖤</div></div>
<script>
let current=1;
function next(n){document.querySelector('.s'+current).classList.remove('active');current=n;document.querySelector('.s'+current).classList.add('active');}
</script>
</body>
</html>
