<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeriksa QRIS & Generator Laporan Penipuan</title>
    <!-- Tailwind CSS untuk tampilan yang bersih -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsQR Library untuk membaca QR Code di browser -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-red-600 mb-2">Pemeriksa QRIS & Generator Laporan</h1>
        <p class="text-sm text-gray-600 mb-6">Alat bantu korban penipuan QRIS untuk mengekstrak data merchant secara sah dan menyusun draf laporan pengaduan resmi.</p>

        <!-- Bagian Upload Gambar QR -->
        <div class="mb-6 p-4 border-2 border-dashed border-gray-300 rounded-lg text-center">
            <label class="block text-sm font-medium text-gray-700 mb-2">Unggah Gambar QRIS Pelaku:</label>
            <input type="file" id="qrisFile" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
        </div>

        <div id="statusMessage" class="mb-4 text-sm font-medium text-blue-600"></div>

        <!-- Form Data Korban -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Korban:</label>
                <input type="text" id="victimName" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="Nama Lengkap">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">No. Kontak / HP:</label>
                <input type="text" id="victimContact" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="08xxxxxxxxxx">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Nominal Kerugian (Rp):</label>
                <input type="text" id="victimAmount" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="Contoh: 500000">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">No. Referensi (RRN di Bukti Transfer):</label>
                <input type="text" id="victimRrn" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="Nomor RRN / Transaksi">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700">Kronologi Singkat Kejadian:</label>
            <textarea id="victimChronology" rows="3" class="mt-1 block w-full rounded-md border-gray-300 border p-2 text-sm" placeholder="Jelaskan bagaimana penipuan terjadi..."></textarea>
        </div>

        <button onclick="generateReport()" class="w-full bg-red-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-red-700 transition duration-200">Buat Draf Laporan Resmi</button>

        <!-- Hasil Output -->
        <div class="mt-8">
            <label class="block text-sm font-medium text-gray-700 mb-2">Hasil Laporan (Siap Disalin):</label>
            <textarea id="outputReport" rows="12" readonly class="w-full bg-gray-100 border border-gray-300 rounded-md p-3 text-xs font-mono"></textarea>
            <button onclick="copyReport()" class="mt-2 bg-gray-800 text-white py-1.5 px-4 rounded-md text-sm hover:bg-gray-900 transition duration-200">Salin Teks Laporan</button>
        </div>
    </div>

    <script>
        let extractedQrisData = {
            merchant_name: "Belum dimuat",
            merchant_city: "Belum dimuat",
            postal_code: "Belum dimuat",
            nmid: "Belum dimuat",
            pjsp_info: [],
            raw_payload: "Belum dimuat"
        };

        function parseEmvTlv(data) {
            let index = 0;
            let parsed = {};
            while (index < data.length) {
                if (index + 4 > data.length) break;
                let tag = data.substring(index, index + 2);
                let lengthStr = data.substring(index + 2, index + 4);
                let length = parseInt(lengthStr, 10);
                if (isNaN(length)) break;
                let value = data.substring(index + 4, index + 4 + length);
                parsed[tag] = value;
                index += 4 + length;
            }
            return parsed;
        }

        document.getElementById('qrisFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        document.getElementById('statusMessage').innerText = "Berhasil membaca QRIS!";
                        document.getElementById('statusMessage').className = "mb-4 text-sm font-medium text-green-600";
                        
                        let rawPayload = code.data;
                        let tlv = parseEmvTlv(rawPayload);

                        extractedQrisData.raw_payload = rawPayload;
                        extractedQrisData.merchant_name = tlv["59"] || "Tidak tercantum";
                        extractedQrisData.merchant_city = tlv["60"] || "Tidak tercantum";
                        extractedQrisData.postal_code = tlv["61"] || "Tidak tercantum";
                        
                        let pjsps = [];
                        for (let i = 26; i <= 51; i++) {
                            let tagStr = i.toString();
                            if (tlv[tagStr]) {
                                let subTlv = parseEmvTlv(tlv[tagStr]);
                                pjsps.push({
                                    penyedia: subTlv["00"] || "Unknown",
                                    merchant_id: subTlv["01"] || "Unknown"
                                });
                            }
                        }
                        extractedQrisData.pjsp_info = pjsps;

                        if (tlv["51"]) {
                            let sub51 = parseEmvTlv(tlv["51"]);
                            extractedQrisData.nmid = sub51["02"] || "Tidak terdeteksi";
                        }
                    } else {
                        document.getElementById('statusMessage').innerText = "Gagal membaca QR Code. Pastikan gambar jelas dan tidak buram.";
                        document.getElementById('statusMessage').className = "mb-4 text-sm font-medium text-red-600";
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function generateReport() {
            const name = document.getElementById('victimName').value || "[Nama Belum Diisi]";
            const contact = document.getElementById('victimContact').value || "[Kontak Belum Diisi]";
            const amount = document.getElementById('victimAmount').value || "[Nominal Belum Diisi]";
            const rrn = document.getElementById('victimRrn').value || "[RRN Belum Diisi]";
            const chrono = document.getElementById('victimChronology').value || "[Kronologi Belum Diisi]";
            const now = new Date().toLocaleString();

            let pjspText = "";
            extractedQrisData.pjsp_info.forEach(item => {
                pjspText += `   - Penyedia Jasa (PJSP) : ${item.penyedia}\n   - ID Merchant Internal : ${item.merchant_id}\n`;
            });

            let report = `====================================================================
DOKUMEN BUKTI DIGITAL & KRONOLOGI PENIPUAN TRANSAKSI QRIS
Waktu Pembuatan: ${now}
====================================================================

1. DATA PELAPOR (KORBAN)
   - Nama Lengkap         : ${name}
   - Kontak / No. HP      : ${contact}
   - Nominal Kerugian     : Rp ${amount}
   - No. Referensi (RRN)  : ${rrn}

2. IDENTITAS MERCHANT PENERIMA (EKSTRAKSI METADATA QRIS)
   - Nama Merchant        : ${extractedQrisData.merchant_name}
   - Kota Terdaftar       : ${extractedQrisData.merchant_city}
   - Kode Pos             : ${extractedQrisData.postal_code}
   - National Merchant ID : ${extractedQrisData.nmid}
${pjspText}
   - Raw Payload QRIS     : 
     ${extractedQrisData.raw_payload}

3. KRONOLOGI SINGKAT KEJADIAN
   ${chrono}

4. TINDAKAN YANG DIMOHONKAN KEPADA BANK / PJSP / KEPOLISIAN
   - Permohonan pemblokiran sementara (freeze) terhadap akun merchant terkait.
   - Pelacakan identitas pemilik rekening/akun (KYC) melalui PJSP terkait.
====================================================================`;

            document.getElementById('outputReport').value = report;
        }

        function copyReport() {
            const outputText = document.getElementById('outputReport');
            outputText.select();
            document.execCommand('copy');
            alert('Laporan berhasil disalin ke clipboard!');
        }
    </script>
</body>
</html>
